# Root Netlify configuration for RAGE Cloud monorepo
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

# Rich Social Preview Edge Function for crawlers (Telegram, WhatsApp, Twitter, Discord)
[[edge_functions]]
  path = "/d/*"
  function = "og-preview"

# Proxy /api requests directly to Railway Backend
[[redirects]]
  from = "/api/*"
  to = "https://rdkwebsite-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback rule for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Explicit headers for Google AdSense verification
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

