# Root Netlify configuration for RAGE Cloud monorepo
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

# Proxy /api requests directly to Railway Backend
[[redirects]]
  from = "/api/*"
  to = "https://rdkwebsite-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback rule for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
