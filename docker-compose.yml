services:
  postgres:
    image: postgres:16-alpine
    container_name: rage_cloud_postgres
    restart: always
    environment:
      POSTGRES_USER: rage_user
      POSTGRES_PASSWORD: rage_password
      POSTGRES_DB: rage_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rage_user -d rage_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rage_cloud_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: rage_cloud_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://rage_user:rage_password@postgres:5432/rage_cloud
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=google_drive
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage_uploads:/app/storage_uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: rage_cloud_worker
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://rage_user:rage_password@postgres:5432/rage_cloud
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "-c", "import asyncio; from app.workers.tasks import background_worker_loop; asyncio.run(background_worker_loop())"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: rage_cloud_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
